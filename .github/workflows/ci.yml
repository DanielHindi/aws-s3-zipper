name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  integration-minio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/minio/health/live && break
            sleep 2
          done
          curl -sf http://127.0.0.1:9000/minio/health/live
      - run: npm ci
      - run: npm run test:integration
        env:
          S3ZIPPER_TEST_ENDPOINT: http://127.0.0.1:9000
          S3ZIPPER_TEST_ACCESS_KEY: minioadmin
          S3ZIPPER_TEST_SECRET_KEY: minioadmin
          S3ZIPPER_TEST_BUCKET: aws-s3-zipper-ci
      - name: MinIO logs
        if: failure()
        run: docker logs minio
